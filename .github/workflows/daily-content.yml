name: Daily Content Posting

on:
  schedule:
    # Every day at 1 PM UTC (9 AM DR time)
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      skip_posting:
        description: 'Preview mode: build the post in dry-run, do NOT publish or commit anything'
        type: boolean
        default: false
      verify_only:
        description: 'Only check that the Facebook token works. Publishes nothing.'
        type: boolean
        default: false

permissions:
  contents: write

# A scheduled run and a manual dispatch must never mutate the pipeline state
# (post-log, queue, image rotation) in parallel.
concurrency:
  group: daily-content
  cancel-in-progress: false

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      # Gate the whole pipeline on Facebook credentials existing. Without a
      # token the poster cannot publish, so generating a post would only pile
      # up unpostable items in the queue (and fail the run, emailing the owner
      # every day). No token => the job is a clean no-op.
      - name: Check Facebook credentials
        id: creds
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: |
          if [ -z "$FB_PAGE_ID" ]; then
            echo "has_creds=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Poster dormant::FB_PAGE_ID secret not set — skipping generation and posting. Nothing was queued."
          else
            echo "has_creds=true" >> "$GITHUB_OUTPUT"
          fi

      # Token check (manual only): asks Meta who this token belongs to. Use it
      # after rotating the token, before trusting the next scheduled run.
      - name: Verify Facebook token only
        if: ${{ github.event.inputs.verify_only == 'true' }}
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: python automation/fb_autoposter.py --verify

      # Preview mode (manual only): build today's post in dry-run and show it in
      # the run log. Writes nothing, commits nothing — so preview never leaves a
      # stale item behind to be posted later.
      - name: Preview post (dry-run, no publish)
        if: ${{ github.event.inputs.skip_posting == 'true' && github.event.inputs.verify_only != 'true' }}
        run: python automation/build_queue.py --dry-run

      - name: Build content queue
        if: ${{ steps.creds.outputs.has_creds == 'true' && github.event.inputs.skip_posting != 'true' && github.event.inputs.verify_only != 'true' }}
        run: python automation/build_queue.py

      - name: Run Facebook auto-poster
        if: ${{ steps.creds.outputs.has_creds == 'true' && github.event.inputs.skip_posting != 'true' && github.event.inputs.verify_only != 'true' }}
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: python automation/fb_autoposter.py

      # Runs even if the poster aborted (throttle/policy): the queue statuses
      # mutated before the abort must be persisted to avoid re-posting.
      # Commit BEFORE pulling so a rebase/autostash conflict can never drop
      # the state, and retry the pull+push to cover pushes landing in the
      # window (losing this commit means re-posting to Facebook tomorrow).
      # Only runs when we actually posted — never in dry-run/no-token paths.
      - name: Persist pipeline state
        if: ${{ !cancelled() && steps.creds.outputs.has_creds == 'true' && github.event.inputs.skip_posting != 'true' && github.event.inputs.verify_only != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in automation/data/post-log.json automation/data/content-queue.json automation/data/image-rotation.json; do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done
          if git diff --cached --quiet; then
            echo "No state changes to persist."
            exit 0
          fi
          git commit -m "chore(bot): estado $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash && git push; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying in 10s..."
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          echo "Could not push pipeline state after 3 attempts." >&2
          exit 1
